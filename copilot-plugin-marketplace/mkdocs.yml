site_name: GitHub Copilot 情報共有会 — Plugin Marketplace
use_directory_urls: false
theme:
  name: material
  language: ja
  features:
    - navigation.sections
    - navigation.footer
plugins: []
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
nav:
  - 概要: index.md
  - 1. ハーネスとは: 01-harness.md
  - 2. agent skillとは: 02-agent-skill.md
  - 3. MCPとは: 03-mcp.md
  - 4. agent pluginとは: 04-agent-plugin.md
  - 5. marketplaceとは: 05-marketplace.md
  - 6. 社内提案: 06-proposal.md
  - 参考資料: 07-references.md
