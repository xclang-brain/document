name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "copilot-plugin-marketplace/**"
      - "svn-to-github-migration/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: pip install mkdocs-material
      # 既存の URL を変えないよう、情報共有会の資料はサイトのトップに置く
      - run: mkdocs build --strict -f copilot-plugin-marketplace/mkdocs.yml -d "$GITHUB_WORKSPACE/_site"
      - run: mkdocs build --strict -f svn-to-github-migration/mkdocs.yml -d "$GITHUB_WORKSPACE/_site/svn-to-github-migration"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
