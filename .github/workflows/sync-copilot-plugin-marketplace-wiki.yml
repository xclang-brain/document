name: Sync copilot-plugin-marketplace to Wiki

on:
  push:
    branches: [main]
    paths:
      - "copilot-plugin-marketplace/**"
      - ".github/scripts/mkdocs_to_wiki.py"
      - ".github/workflows/sync-copilot-plugin-marketplace-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: pip install pyyaml
      - name: Clone wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
      - run: python .github/scripts/mkdocs_to_wiki.py copilot-plugin-marketplace wiki
      - name: Push wiki
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Sync from ${GITHUB_SHA}"
            git push
          fi
