site_name: GitHub 移行説明資料
use_directory_urls: false
theme:
  name: material
  language: ja
  features:
    - navigation.sections
    - navigation.footer
plugins: []
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
nav:
  - 概要: index.md
  - 1. Git と GitHub の概要: 01-git-github.md
  - 2. Git・GitHub のメリット: 02-merits.md
  - 3. AI 活用の幅の拡大: 03-ai.md
  - 4. 移行のコストと懸念: 04-cost-concerns.md
  - 5. 移行の進め方: 05-plan.md
